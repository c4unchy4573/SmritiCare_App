services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smriti
      POSTGRES_PASSWORD: smriti_dev
      POSTGRES_DB: smriticare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

volumes:
  pgdata: